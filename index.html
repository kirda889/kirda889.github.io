<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>يوسف الشمراني</title>
<meta name="theme-color" content="#1F6B4C">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap">
<style>
:root{--bg:#F2F5F3;--ink:#172420;--muted:#5A6B64;--line:#D9E1DD;--accent:#1F6B4C;--card:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1512;--ink:#E6ECE8;--muted:#9BAAA3;--line:#27332D;--accent:#5BC093;--card:#171F1B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--ink:#E6ECE8;--muted:#9BAAA3;--line:#27332D;--accent:#5BC093;--card:#171F1B;color-scheme:dark}
html,body{background:var(--bg)}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:"Cairo",system-ui,-apple-system,sans-serif;padding-inline:16px}
main{max-width:520px;display:grid;gap:10px;text-align:start;padding-block:40px}
h1{margin:0;font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700}
p{margin:0;color:var(--muted);font-weight:300;font-size:1.05rem}
a{justify-self:start;margin-top:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700}
</style></head><body><main>
<h1>يوسف الشمراني</h1>
<p>الموقع قيد الإعداد.</p>
<a href="/qiyas/">اختبارات الرخصة المهنية و<bdi>STEP</bdi></a>
</main></body></html>
